<!-- VIEW-ONLY RESUME MODAL -->
  <div id="resume-modal" class="modal-overlay" onclick="closeModalOnOuter(event, 'resume-modal')">
    <div class="modal-content">
      <div class="modal-header">
        <span>Abiya Pardeshi — Resume (View Only)</span>
        <button class="modal-close" onclick="closeModal('resume-modal')">✕</button>
      </div>
      <div class="modal-body protect-view">
        <iframe src="resume.pdf#toolbar=0&navpanes=0&scrollbar=0" class="pdf-frame"></iframe>
      </div>
    </div>
  </div>

  <!-- VIEW-ONLY CERTIFICATE MODAL -->
  <div id="cert-modal" class="modal-overlay" onclick="closeModalOnOuter(event, 'cert-modal')">
    <div class="modal-content">
      <div class="modal-header">
        <span id="cert-modal-title">Certificate Viewer</span>
        <button class="modal-close" onclick="closeModal('cert-modal')">✕</button>
      </div>
      <div class="modal-body protect-view">
        <iframe id="cert-iframe" src="" class="pdf-frame"></iframe>
      </div>
    </div>
  </div>
